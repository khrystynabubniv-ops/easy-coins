services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: easycoins
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
